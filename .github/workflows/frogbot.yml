name: Frogbot Security Scan
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-and-fix:
    # This privileged job only installs reviewed integration branch code.
    # PR compilation runs separately in Static Analysis without secrets.
    if: github.repository == 'jfrog/jfrog-azure-devops-extension' && contains(fromJSON('["refs/heads/dev", "refs/heads/v2"]'), github.ref)
    runs-on: ubuntu-latest
    environment: frogbot
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    strategy:
      matrix:
        branch: [dev, v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: jfrog/frogbot@a22483eb236de56eaf17174b50f7a5cc16d85e33 # v2
        env:
          JF_URL: ${{ secrets.FROGBOT_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_BASE_BRANCH: ${{ matrix.branch }}
