# Ported from .jfrog-pipelines/pipelines.staging.yml (JFrog Pipelines is EOL)
name: Staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  staging:
    if: github.repository == 'jfrog/jfrog-azure-devops-extension' && github.ref == 'refs/heads/dev'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Publish extension to staging
        env:
          ADO_ARTIFACTORY_DEVELOPER: ecosystem-staging
          ADO_ARTIFACTORY_API_KEY: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: .github/scripts/staging.sh
