# Tests that runs on a local Artifactory instance
name: Tests
on:
  push:
    branches:
      - dev
      - v2
    tags-ignore:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
# Ensures that only the latest commit is running for each PR at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Tests:
    name: ${{ matrix.os }} Node ${{ matrix.node-version }}
    # This suite needs a license. Run only reviewed code from integration branches.
    if: github.repository == 'jfrog/jfrog-azure-devops-extension' && contains(fromJSON('["refs/heads/dev", "refs/heads/v2"]'), github.ref)
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu, windows ]
        node-version: [ '20', '24' ]
        include:
          - os: windows
            extraSkipTests: ",conan"
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Conan
        run: pip install "conan<2" -q

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Pinned instead of relying on the OS image's bundled Maven: ubuntu-latest's
      # image was bumped to Maven 3.10.0, whose maven-resolver/aether jars dropped
      # DefaultArtifactResolver's no-arg constructor, breaking the Artifactory
      # build-info-extractor Maven plugin (NoSuchMethodError) on ubuntu only.
      - name: Setup Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: '3.9.9'

      - name: Install Mono
        run: |
          sudo apt update
          sudo apt install mono-complete
          mono --version
        if: ${{ matrix.os == 'ubuntu' }}

      - name: Install JFrog CLI
        uses: jfrog/setup-jfrog-cli@5a4fbe1e30dbb570cc62d2513421c4b9bc3c9959 # v4
        with:
          version: '2.130.0'

      - name: Install local Artifactory
        uses: jfrog/.github/actions/install-local-artifactory@4e59ec4120375f2090d805033a7b3af6f74a9388 # main
        with:
          RTLIC: ${{ secrets.RTLIC }}

      - name: Install
        run: npm install --no-fund

      - name: Run tests
        run: npm t
        env:
          ADO_JFROG_PLATFORM_URL: http://localhost:8081/
          ADO_JFROG_PLATFORM_USERNAME: admin
          ADO_JFROG_PLATFORM_PASSWORD: password
          ADO_SKIP_TESTS: docker,distribution${{ matrix.extraSkipTests }}
