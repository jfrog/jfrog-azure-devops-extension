# Tests that runs on a local Artifactory instance
name: Tests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  # Triggers the workflow on labeled PRs only.
  pull_request_target:
    types: [ labeled ]
  # Run on PR when this workflow file changes (to validate workflow changes on the same PR).
  pull_request:
    types: [ opened, synchronize ]
    paths:
      - '.github/workflows/tests.yml'

# Ensures that only the latest commit is running for each PR at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Tests:
    name: ${{ matrix.os }} Node ${{ matrix.node-version }}
    if: contains(github.event.pull_request.labels.*.name, 'safe to test') || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu, windows ]
        node-version: [ '16', '20', '24' ]
        include:
          - os: windows
            extraSkipTests: ",conan"
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Conan
        run: pip install "conan<2" -q

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Mono
        run: |
          sudo apt update
          sudo apt install mono-complete
          mono --version
        if: ${{ matrix.os == 'ubuntu' }}

      - name: Install JFrog CLI
        run: curl -fL https://install-cli.jfrog.io | sh

      - name: Install local Artifactory
        uses: jfrog/.github/actions/install-local-artifactory@main
        with:
          RTLIC: ${{ secrets.RTLIC }}

      - name: Install
        run: npm install --no-fund

      - name: Run tests
        run: npm t
        env:
          ADO_JFROG_PLATFORM_URL: http://localhost:8081/
          ADO_JFROG_PLATFORM_USERNAME: admin
          ADO_JFROG_PLATFORM_PASSWORD: password
          ADO_SKIP_TESTS: docker,distribution${{ matrix.extraSkipTests }}
